name: Update NOAA X-ray Data

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download NOAA data
        run: |
          mkdir -p data

          curl -L --fail --retry 2 --connect-timeout 15 --max-time 45 \
            -A "DeepPIFM-KASI/1.0" \
            "https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json" \
            -o data/xrays-1-day.json

          curl -L --fail --retry 2 --connect-timeout 15 --max-time 45 \
            -A "DeepPIFM-KASI/1.0" \
            "https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json" \
            -o data/xrays-7-day.json

          python3 -m json.tool data/xrays-1-day.json > /tmp/x1.json
          python3 -m json.tool data/xrays-7-day.json > /tmp/x7.json
          mv /tmp/x1.json data/xrays-1-day.json
          mv /tmp/x7.json data/xrays-7-day.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/xrays-1-day.json data/xrays-7-day.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update NOAA X-ray data"
            git push
          fi